name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest httpx
        
    - name: Run tests
      run: |
        # Start server in background
        python -m uvicorn main:app --port 8000 &
        
        # Wait for server to start
        sleep 5
        
        # Run tests
        pytest tests/
        
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v3
    
    # As Vercel usually deploys automatically on push, this job can serve as a placeholder
    # for explicit deployment steps if needed. If Vercel is set up, it will deploy once tests pass.
    - name: Deployment Placeholder
      run: |
        echo "Tests passed! Automatic deployment (e.g., via Vercel) will trigger now."
