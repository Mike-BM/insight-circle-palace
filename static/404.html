<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Insight Circle</title>
    <meta name="description" content="The page you are looking for does not exist or has been moved. Return to Insight Circle.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/apple-touch-icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0B0B0D;
            color: #F4F4F5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 540px;
            width: 100%;
            background-color: #141418;
            border: 1px solid #27272D;
            border-radius: 12px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #A855F7;
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .status-code {
            font-size: 72px;
            font-weight: 800;
            line-height: 1;
            color: #F4F4F5;
            letter-spacing: -0.04em;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #F4F4F5;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #A1A1AA;
            margin-bottom: 32px;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #A855F7;
            color: #FFFFFF;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.15s ease;
        }
        .btn-primary:hover {
            background-color: #9333EA;
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #1A1A22;
            color: #E4E4E7;
            border: 1px solid #27272D;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            text-decoration: none;
            transition: border-color 0.15s ease, color 0.15s ease;
        }
        .btn-secondary:hover {
            border-color: #3F3F46;
            color: #FFFFFF;
        }
        .footer-note {
            margin-top: 36px;
            font-size: 12px;
            color: #71717A;
        }
    </style>
    <!-- Prevent Auth FOUC -->
    <script>
        try {
            if (localStorage.getItem('insightCircleMember')) {
                document.documentElement.classList.add('user-logged-in');
            }
        } catch(e) {}
    </script>
    <script src="/static/js/theme-toggle.js"></script>
</head>
<body>
    <div class="container">
        <div class="badge">404 Error</div>
        <div class="status-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page or resource you are looking for has moved, expired, or doesn't exist. Check the URL or return to safety.</p>
        <div class="actions">
            <a href="/static/index.html" class="btn-primary">Return to Home</a>
            <a href="/static/explore.html" class="btn-secondary">Explore Programs</a>
        </div>
        <div class="footer-note">
            Insight Circle &bull; Empowering Leaders & Innovators
        </div>
    </div>
</body>
</html>
