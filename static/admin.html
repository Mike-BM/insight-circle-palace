<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Insight Circle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { display: flex; min-height: 100vh; margin: 0; font-family: 'Inter', sans-serif; background-color: #0b0c10; color: #fff; padding-top: 80px; }
        .sidebar { width: 250px; background: rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.1); padding: 2rem 1rem; position: fixed; top: 80px; bottom: 0; }
        .sidebar a { display: block; color: #aaa; text-decoration: none; padding: 0.75rem 1rem; margin-bottom: 0.5rem; border-radius: 4px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,215,0,0.1); color: #ffd700; }
        .main-content { margin-left: 250px; padding: 2rem; flex: 1; }
        .table-container { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; overflow-x: auto; padding: 1rem; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #ffd700; font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .badge { padding: 0.25rem 0.5rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .badge-admin { background: rgba(255,215,0,0.2); color: #ffd700; }
        .badge-user { background: rgba(255,255,255,0.1); color: #ccc; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #1f2833; margin: 15% auto; padding: 20px; border: 1px solid rgba(255,255,255,0.2); width: 80%; max-width: 400px; border-radius: 8px; color: #fff; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover, .close:focus { color: #fff; text-decoration: none; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #ffd700; }
        .form-group select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: #0b0c10; color: #fff; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #ffd700; color: #0b0c10; }
        .btn-primary:hover { background: #e5c100; }
        .btn-action { padding: 4px 8px; font-size: 0.8em; margin-right: 5px; background: rgba(255,255,255,0.1); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .btn-action:hover { background: rgba(255,255,255,0.2); }
        .btn-danger { background: rgba(244,67,54,0.2); color: #f44336; }
        .btn-danger:hover { background: rgba(244,67,54,0.3); }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <div class="logo">
                <a href="/static/index.html" style="text-decoration: none; color: inherit;">
                    <img src="/static/assets/logo.jpg" alt="Logo" style="height: 40px; width: 40px; border-radius: 50%;">
                </a>
            </div>
            <div class="nav-menu">
                <div class="nav-links">
                    <a href="/static/dashboard.html">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <aside class="sidebar">
        <h3 style="padding-left: 1rem; margin-top: 0; color: #ffd700;">Admin Panel</h3>
        <a href="#users" id="nav-users" class="active" onclick="switchTab('users')"><i class="fa-solid fa-users" style="width: 25px;"></i> Users</a>
        <a href="#analytics" id="nav-analytics" onclick="switchTab('analytics')"><i class="fa-solid fa-chart-line" style="width: 25px;"></i> Analytics</a>
    </aside>

    <main class="main-content">
        <div id="users-section">
            <h1>User Management</h1>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Verified</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="6" style="text-align: center; color: #aaa;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Analytics Section -->
        <div id="analytics-section" style="display: none; margin-top: 2rem;">
            <h1>Site Analytics</h1>
            <div style="display: flex; gap: 20px;">
                <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 20px; flex: 1; text-align: center;">
                    <h3 style="color: #ffd700; margin-top: 0;">Total Page Views</h3>
                    <div id="stat-pageviews" style="font-size: 2.5rem; font-weight: bold;">--</div>
                </div>
                <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 20px; flex: 1; text-align: center;">
                    <h3 style="color: #ffd700; margin-top: 0;">Active Authenticated Users</h3>
                    <div id="stat-activeusers" style="font-size: 2.5rem; font-weight: bold;">--</div>
                </div>
            </div>
        </div>
    </main>

    <!-- The Modal -->
    <div id="editUserModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2 style="margin-top:0; color:#ffd700;">Edit User</h2>
            <input type="hidden" id="editUserId">
            <div class="form-group">
                <label for="editRole">Role</label>
                <select id="editRole">
                    <option value="user">Member</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="form-group">
                <label for="editStatus">Status</label>
                <select id="editStatus">
                    <option value="active">Active</option>
                    <option value="suspended">Suspended</option>
                </select>
            </div>
            <button class="btn btn-primary" id="saveUserBtn">Save Changes</button>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
    <script src="/static/js/tracker.js"></script>
</body>
</html>
