</head>
<body class="bg-navy text-slate-300 antialiased min-h-screen flex flex-col">

            <!-- Navigation -->
    <script>DS.header()</script>

    <div class="flex-grow max-w-6xl mx-auto w-full mt-28 mb-12 px-6 relative z-10">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-white/10 pb-6 mb-10">
            <div>
                <h1 class="text-3xl font-display font-bold text-white">My Certificates</h1>
                <p class="text-slate-400 mt-1">View and download your earned achievements.</p>
            </div>
            <div class="hidden md:block">
                <span class="bg-gold/10 text-gold border border-gold/20 px-4 py-2 rounded-full text-sm font-semibold">
                    <span id="cert-count">0</span> Earned
                </span>
            </div>
        </div>

        <div id="certificates-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Skeletons -->
            <div class="bg-slate-900 border border-white/10 rounded-2xl p-6 shadow-xl animate-pulse">
                <div class="h-40 bg-slate-800 rounded-lg mb-4"></div>
                <div class="h-6 bg-slate-700 rounded w-3/4 mb-2"></div>
                <div class="h-4 bg-slate-700 rounded w-1/2 mb-6"></div>
                <div class="flex justify-between">
                    <div class="h-10 bg-slate-800 rounded w-24"></div>
                    <div class="h-10 bg-slate-800 rounded w-24"></div>
                </div>
            </div>
        </div>
        
        <div id="empty-state" class="hidden flex flex-col items-center justify-center text-center py-20 bg-slate-900/40 border border-white/5 rounded-2xl">
            <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mb-6">
                <i class="fa-solid fa-award text-3xl text-slate-500"></i>
            </div>
            <h3 class="text-xl font-display font-bold text-white mb-2">No certificates yet</h3>
            <p class="text-slate-400 max-w-md mx-auto mb-6">Complete a program or season to earn your first certificate. Your achievements will appear here.</p>
            <a href="/static/my-programs.html" class="px-6 py-2 bg-gold/10 text-gold border border-gold/30 hover:bg-gold/20 font-semibold rounded-lg transition-colors">View My Programs</a>
        </div>
    </div>

            <!-- Footer -->
    <script>DS.footer()</script>
    <noscript><footer class="ds-footer"><div class="ds-container" style="padding-block:2rem"><p><a href="/static/index.html">Home</a> &middot; <a href="/privacy-policy">Privacy Policy</a> &middot; <a href="/terms-and-conditions">Terms and Conditions</a> &middot; <a href="mailto:Insightcirclepalace@gmail.com">Insightcirclepalace@gmail.com</a></p></div></footer></noscript>

    <script src="/static/js/auth-guard.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const user = await window.requireAuth('/static/certificates.html');
            if(!user) return;
            
            if (user.photo_url) {
                document.getElementById('nav-avatar').src = user.photo_url;
            } else {
                document.getElementById('nav-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.full_name)}&background=D4A345&color=fff`;
            }

            try {
                const res = await fetch('/me/certificates', { credentials: 'include' });
                
                if (res.ok) {
                    const certs = await res.json();
                    const container = document.getElementById('certificates-container');
                    const emptyState = document.getElementById('empty-state');
                    const countEl = document.getElementById('cert-count');
                    
                    if (certs.length === 0) {
                        container.innerHTML = '';
                        emptyState.classList.remove('hidden');
                        countEl.innerText = '0';
                    } else {
                        countEl.innerText = certs.length;
                        container.innerHTML = certs.map(c => `
                            <div class="bg-slate-900 border border-white/10 rounded-2xl p-6 shadow-xl flex flex-col h-full group hover:border-gold/30 transition-colors">
                                <div class="bg-gradient-to-br from-navy to-slate-800 rounded-lg p-6 mb-6 flex-grow flex flex-col items-center justify-center text-center border border-white/5 relative overflow-hidden">
                                    <div class="absolute inset-0 bg-[url('/static/assets/logo.jpg')] bg-cover bg-center opacity-5"></div>
                                    <i class="fa-solid fa-certificate text-4xl text-gold mb-4 relative z-10"></i>
                                    <h4 class="font-display font-bold text-lg text-white mb-1 relative z-10">${c.program}</h4>
                                    <p class="text-xs text-gold/70 relative z-10">Insight Circle</p>
                                </div>
                                <div class="mb-6">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-xs text-slate-500 uppercase font-semibold tracking-wider">Issued</span>
                                        <span class="text-sm font-medium text-slate-300">${new Date(c.issue_date).toLocaleDateString()}</span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-xs text-slate-500 uppercase font-semibold tracking-wider">ID</span>
                                        <span class="text-xs font-mono text-slate-400 bg-slate-800 px-2 py-1 rounded">${c.certificate_number}</span>
                                    </div>
                                </div>
                                <div class="flex justify-between gap-3 mt-auto">
                                    <a href="/verify.html?code=${c.verification_code}" target="_blank" class="flex-1 py-2 text-center bg-slate-800 hover:bg-slate-700 text-white font-medium rounded-lg text-sm transition-colors border border-white/10">Verify</a>
                                    <a href="${c.pdf_url}" target="_blank" class="flex-1 py-2 text-center bg-gold/10 hover:bg-gold/20 text-gold border border-gold/30 font-medium rounded-lg text-sm transition-colors flex items-center justify-center gap-2"><i class="fa-solid fa-download"></i> PDF</a>
                                </div>
                            </div>
                        `).join('');
                    }
                } else {
                    document.getElementById('certificates-container').innerHTML = `
                        <div class="col-span-full p-4 bg-red-500/10 border border-red-500/20 text-red-400 rounded-lg text-center">
                            Failed to load certificates. Please try again later.
                        </div>`;
                }
            } catch(e) {
                console.error(e);
                document.getElementById('certificates-container').innerHTML = `
                    <div class="col-span-full p-4 bg-red-500/10 border border-red-500/20 text-red-400 rounded-lg text-center">
                        Network error while loading certificates.
                    </div>`;
            }
        });
    </script>

</body>
</html>
