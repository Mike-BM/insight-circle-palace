<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Calendar | Insight Circle</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-container { max-width: 1000px; margin: 120px auto 80px; padding: 2rem; color: #fff; min-height: 60vh; }
        .page-header { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; margin-bottom: 2rem; }
        .page-header h1 { color: #ffd700; margin-bottom: 0.5rem; }
        
        .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
        .event-card { 
            background: rgba(255,255,255,0.05); 
            padding: 1.5rem; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.1); 
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .event-date { 
            background: rgba(255,215,0,0.15); 
            color: #ffd700; 
            padding: 0.5rem; 
            border-radius: 4px; 
            display: inline-block; 
            font-weight: 600; 
            font-size: 0.9rem;
            text-align: center;
        }
        .event-card h3 { margin: 0; font-size: 1.3rem; }
        .event-card p { color: #ccc; flex-grow: 1; }
        
        .btn-book { 
            background: #ffd700; 
            color: #000; 
            text-decoration: none; 
            padding: 10px 15px; 
            border-radius: 4px; 
            font-weight: bold; 
            text-align: center; 
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .btn-book:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <div class="logo">
                <a href="/static/index.html" style="text-decoration: none; color: inherit;">
                    <img src="/static/assets/logo.jpg" alt="Insight Circle Logo" style="height: 40px; width: 40px; object-fit: contain; flex-shrink: 0; vertical-align: middle; border-radius: 50%;">
                </a>
            </div>
            <div class="mobile-toggle" id="mobile-toggle">
                <i class="fa-solid fa-bars"></i>
            </div>
            <div class="nav-menu" id="nav-menu">
                <div class="nav-links">
                    <a href="/static/index.html#home">Home</a>
                    <a href="/static/dashboard.html">Dashboard</a>
                    <a href="/static/explore.html">Explore</a>
                    <a href="/static/events.html" style="color: #ffd700;">Events</a>
                </div>
                <div class="nav-auth" id="nav-auth-container">
                    <a href="/static/login.html" class="login-link">Log In</a>
                    <a href="/static/register.html" class="btn btn-primary">Join Now</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h1>Events Calendar</h1>
            <p style="color: #aaa;">Join our weekly Monday events to learn, connect, and grow.</p>
        </div>

        <div class="events-grid" id="events-list">
            <p>Loading events...</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <div class="logo" style="margin-bottom: 1rem;">
                        <img src="/static/assets/logo.jpg" alt="Insight Circle Logo" style="height: 40px; width: 40px; object-fit: contain; flex-shrink: 0; vertical-align: middle; border-radius: 50%;">
                    </div>
                    <p style="color: var(--clr-text-muted); font-size: 0.9rem; margin-bottom: 2rem;">
                        Empowering the next generation through education, innovation, and global collaboration.
                    </p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Insight Circle. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // Check auth to update navbar
            let user = null;
            try {
                const res = await fetch('/auth/me');
                if (res.ok) {
                    user = await res.json();
                    document.getElementById('nav-auth-container').innerHTML = `
                        <a href="/static/dashboard.html" class="login-link">${user.full_name}</a>
                        <button onclick="logout()" class="btn btn-primary" style="background:transparent; border:1px solid #ffd700;">Logout</button>
                    `;
                }
            } catch(e) {}

            async function loadEvents() {
                try {
                    const res = await fetch('/events/');
                    if (!res.ok) {
                        if(res.status === 401) {
                            document.getElementById('events-list').innerHTML = "<p>Please <a href='/static/login.html' style='color:#ffd700;'>log in</a> to view and book events.</p>";
                        } else {
                            document.getElementById('events-list').innerHTML = "<p>Failed to load events.</p>";
                        }
                        return;
                    }
                    
                    const events = await res.json();
                    const container = document.getElementById('events-list');
                    
                    if (events.length === 0) {
                        container.innerHTML = "<p style='color:#aaa;'>No upcoming events right now. Check back soon!</p>";
                        return;
                    }

                    container.innerHTML = events.map(evt => {
                        const date = new Date(evt.event_date);
                        const dateString = date.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                        
                        let btnHtml = '';
                        if (evt.is_booked) {
                            btnHtml = `<button class="btn-book" disabled><i class="fa-solid fa-check"></i> Booked</button>`;
                        } else {
                            btnHtml = `<button class="btn-book" onclick="bookEvent('${evt.id}')">Book Now</button>`;
                        }

                        return `
                            <div class="event-card">
                                <div class="event-date">${dateString}</div>
                                <h3>${evt.title}</h3>
                                <p>${evt.description || 'Join us for this exciting event!'}</p>
                                ${btnHtml}
                            </div>
                        `;
                    }).join('');
                } catch(e) {
                    console.error(e);
                    document.getElementById('events-list').innerHTML = "<p>Error loading events.</p>";
                }
            }
            
            loadEvents();

            window.bookEvent = async function(eventId) {
                if(!user) {
                    window.location.href = '/static/login.html';
                    return;
                }
                
                try {
                    const res = await fetch(`/events/${eventId}/book`, { method: 'POST' });
                    if(res.ok) {
                        alert("Successfully booked the event! The meeting link will be in your dashboard.");
                        loadEvents(); // reload list
                    } else {
                        const data = await res.json();
                        alert(data.detail || "Failed to book event.");
                    }
                } catch(e) {
                    alert("Error booking event.");
                }
            };
            
            window.logout = async function() {
                await fetch('/auth/logout', { method: 'POST' });
                window.location.reload();
            };
        });
    </script>
</body>
</html>
