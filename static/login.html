<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Insight Circle Palace</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: '#080E1E',
              gold: '#D4A345'
            },
            fontFamily: {
              display: ['"Plus Jakarta Sans"', 'sans-serif'],
              sans: ['Inter', 'sans-serif']
            }
          }
        }
      }
    </script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* Autofill overrides */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #0f172a inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="bg-navy font-sans min-h-screen flex items-center justify-center relative overflow-hidden text-slate-300">
    <!-- Ambient Blurs -->
    <div class="absolute -top-40 right-10 w-96 h-96 bg-gold/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 left-10 w-72 h-72 bg-blue-900/20 rounded-full blur-3xl pointer-events-none"></div>
    
    <div class="w-full max-w-md relative z-10 px-6 py-12">
        <a href="/static/index.html" class="flex flex-col items-center justify-center mb-8 gap-3 cursor-pointer group">
            <img src="/static/assets/logo.jpg" alt="Logo" class="w-14 h-14 object-contain rounded-full border border-white/10 group-hover:border-gold/50 transition-colors">
            <span class="text-white font-display font-bold tracking-widest text-sm">INSIGHT CIRCLE PALACE</span>
        </a>

        <div class="bg-slate-900/70 backdrop-blur-2xl border border-white/10 shadow-2xl rounded-2xl p-8">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-display font-bold text-white mb-2">Welcome back.</h2>
                <p class="text-slate-400 text-sm">Continue your journey with us.</p>
            </div>

            <!-- Banner Alert -->
            <div id="auth-banner" class="hidden rounded-lg p-3 mb-6 text-sm flex items-start gap-2" role="alert">
                <span id="banner-text" class="flex-1"></span>
                <button type="button" onclick="closeBanner()" class="text-current opacity-70 hover:opacity-100">&times;</button>
            </div>
            
            <div class="w-full flex justify-center mb-6">
                <div id="google-btn-rendered"></div>
            </div>

            <div class="flex items-center gap-4 my-6">
                <hr class="flex-1 border-white/10">
                <span class="text-xs text-slate-500 uppercase tracking-widest">or sign in with email</span>
                <hr class="flex-1 border-white/10">
            </div>

            <form id="login-form" novalidate class="space-y-5">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email address</label>
                    <input type="email" id="email" class="w-full bg-slate-800/50 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-gold/80 focus:ring-1 focus:ring-gold/40 transition-all" placeholder="name@example.com" required autocomplete="email">
                    <span id="email-error" class="text-red-400 text-xs mt-1 hidden">Please enter a valid email address.</span>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
                        <a href="#" class="text-xs text-gold hover:text-white transition-colors">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" class="w-full bg-slate-800/50 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-gold/80 focus:ring-1 focus:ring-gold/40 transition-all" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" id="toggle-password-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                            <i class="fa-solid fa-eye" id="toggle-icon"></i>
                        </button>
                    </div>
                    <span id="password-error" class="text-red-400 text-xs mt-1 hidden">Please enter your password.</span>
                </div>

                <div class="flex items-center">
                    <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-400 hover:text-white transition-colors">
                        <input type="checkbox" id="remember" class="w-4 h-4 rounded border-white/20 bg-slate-800/50 text-gold focus:ring-gold focus:ring-offset-navy">
                        Remember me
                    </label>
                </div>

                <button type="submit" id="submit-btn" class="w-full mt-6 px-8 py-3.5 bg-gradient-to-r from-gold to-[#E5A93C] text-navy font-bold rounded-lg hover:brightness-110 active:scale-95 transition-all shadow-[0_0_20px_rgba(212,163,69,0.3)]">
                    <span id="btn-text">SIGN IN</span>
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-slate-400">
                Don't have an account? <a href="/static/register.html" class="text-gold font-medium hover:text-white transition-colors">Create one</a>
            </div>
        </div>
    </div>

    <!-- The Javascript stays EXACTLY the same to preserve functionality -->
    <script src="/static/js/auth-guard.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('toggle-password-btn');
        const toggleIcon = document.getElementById('toggle-icon');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const banner = document.getElementById('auth-banner');
        const bannerText = document.getElementById('banner-text');

        // Parse query params for msg or next redirect
        const urlParams = new URLSearchParams(window.location.search);
        const msgParam = urlParams.get('msg');
        const verifiedParam = urlParams.get('verified');
        const errorParam = urlParams.get('error');
        const nextParam = urlParams.get('next') || '/static/onboard.html';

        if (verifiedParam === 'true') {
            showBanner('Email verified — you can now log in', 'success');
        } else if (errorParam === 'invalid_token') {
            showBanner('Invalid or expired verification token.', 'error');
        } else if (msgParam) {
            showBanner(msgParam, 'error');
        }

        // Toggle Password Visibility
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
            togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });

        // Inline Field Validation
        function validateEmail() {
            const val = emailInput.value.trim();
            const err = document.getElementById('email-error');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!val || !emailRegex.test(val)) {
                emailInput.classList.add('has-error');
                err.classList.add('visible');
                return false;
            }
            emailInput.classList.remove('has-error');
            err.classList.remove('visible');
            return true;
        }

        function validatePassword() {
            const val = passwordInput.value;
            const err = document.getElementById('password-error');
            if (!val) {
                passwordInput.classList.add('has-error');
                err.classList.add('visible');
                return false;
            }
            passwordInput.classList.remove('has-error');
            err.classList.remove('visible');
            return true;
        }

        emailInput.addEventListener('blur', validateEmail);
        passwordInput.addEventListener('blur', validatePassword);

        function showBanner(msg, type = 'error') {
            bannerText.innerText = msg;
            banner.className = `auth-banner visible ${type}`;
        }

        function closeBanner() {
            banner.className = 'auth-banner';
        }

        // Form Submit Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            closeBanner();

            const isEmailValid = validateEmail();
            const isPasswordValid = validatePassword();

            if (!isEmailValid || !isPasswordValid) {
                if (!isEmailValid) emailInput.focus();
                else if (!isPasswordValid) passwordInput.focus();
                return;
            }

            submitBtn.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in...';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: emailInput.value.trim(),
                        password: passwordInput.value
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    try {
                        const appRes = await fetch('/applications/me');
                        if (appRes.ok) {
                            const appData = await appRes.json();
                            if (appData.has_application) {
                                window.location.href = '/static/dashboard.html';
                                return;
                            }
                        }
                    } catch (e) {}

                    window.location.href = nextParam;
                } else {
                    showBanner("We couldn't sign you in. Check your email and password and try again.", "error");
                }
            } catch (err) {
                showBanner("Network error — please check your internet connection and try again.", "error");
            } finally {
                submitBtn.disabled = false;
                btnText.innerHTML = 'SIGN IN';
            }
        });

        // Google Identity Services Integration
        let googleClientId = "326628685130-e65tfg5ldhpj8vhje2ucufv9q95d8t19.apps.googleusercontent.com";

        async function initGoogleAuth() {
            try {
                const res = await fetch('/auth/google/config');
                if (res.ok) {
                    const data = await res.json();
                    if (data.client_id) googleClientId = data.client_id;
                }
            } catch (e) {}

            if (window.google && window.google.accounts && window.google.accounts.id) {
                try {
                    google.accounts.id.initialize({
                        client_id: googleClientId,
                        callback: handleGoogleCredentialResponse,
                        auto_select: false,
                        cancel_on_tap_outside: true
                    });

                    const btnContainer = document.getElementById('google-btn-rendered');
                    if (btnContainer) {
                        google.accounts.id.renderButton(btnContainer, {
                            theme: 'filled_black',
                            size: 'large',
                            type: 'standard',
                            shape: 'rectangular',
                            text: 'continue_with',
                            logo_alignment: 'left',
                            width: Math.min(btnContainer.parentElement.offsetWidth || 340, 360)
                        });
                    }
                } catch (err) {
                    console.warn("Google Auth render error:", err);
                    showBanner("Google Sign-In could not load. Please check your connection or use email.", "error");
                }
            } else {
                setTimeout(initGoogleAuth, 400);
            }
        }

        async function handleGoogleCredentialResponse(response) {
            if (!response || !response.credential) {
                showBanner("Failed to receive Google credentials.", "error");
                return;
            }

            showBanner("Verifying with Google...", "success");

            try {
                const res = await fetch('/auth/google', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ credential: response.credential })
                });

                const data = await res.json();
                if (res.ok) {
                    try {
                        const appRes = await fetch('/applications/me');
                        if (appRes.ok) {
                            const appData = await appRes.json();
                            if (appData.has_application) {
                                window.location.href = '/static/dashboard.html';
                                return;
                            }
                        }
                    } catch (e) {}

                    window.location.href = nextParam;
                } else {
                    showBanner(data.detail || "Google authentication failed.", "error");
                }
            } catch (err) {
                showBanner("Network error during Google sign in.", "error");
            }
        }

        window.addEventListener('load', () => {
            initGoogleAuth();
        });
    </script>
    <script src="/static/js/tracker.js"></script>
</body>
</html>
