<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Insight Circle</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/join.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="join-theme auth-page">
    <div class="join-bg" style="background-image: url('https://images.unsplash.com/photo-1464617265593-010537877478?auto=format&fit=crop&w=1920&q=80')"></div>
    <div class="join-bg-overlay"></div>

    <a href="/static/index.html" class="join-logo">
        <i class="fa-solid fa-circle-nodes"></i> Insight Circle
    </a>
    
    <div class="auth-container">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Enter your credentials to continue your journey.</p>
        </div>

        <!-- Banner Alert -->
        <div id="auth-banner" class="auth-banner" role="alert" aria-live="polite">
            <span id="banner-text"></span>
            <button type="button" class="banner-close" onclick="closeBanner()" aria-label="Close message">&times;</button>
        </div>

        <form id="login-form" novalidate>
            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-container">
                    <input type="email" id="email" class="auth-input" placeholder="name@example.com" required>
                </div>
                <span id="email-error" class="field-error" aria-live="polite">Please enter a valid email address.</span>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-container">
                    <input type="password" id="password" class="auth-input" placeholder="Enter your password" required>
                    <button type="button" id="toggle-password-btn" class="toggle-password" aria-label="Toggle password visibility">
                        <i class="fa-solid fa-eye" id="toggle-icon"></i>
                    </button>
                </div>
                <span id="password-error" class="field-error" aria-live="polite">Please enter your password.</span>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submit-btn" class="btn-auth">
                <span id="btn-text">Log In</span>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/static/register.html" class="auth-link">Sign Up</a>
        </div>
    </div>

    <script src="/static/js/auth-guard.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('toggle-password-btn');
        const toggleIcon = document.getElementById('toggle-icon');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const banner = document.getElementById('auth-banner');
        const bannerText = document.getElementById('banner-text');

        // Parse query params for msg or next redirect
        const urlParams = new URLSearchParams(window.location.search);
        const msgParam = urlParams.get('msg');
        const verifiedParam = urlParams.get('verified');
        const errorParam = urlParams.get('error');
        const nextParam = urlParams.get('next') || '/static/onboard.html';

        if (verifiedParam === 'true') {
            showBanner('Email verified — you can now log in', 'success');
        } else if (errorParam === 'invalid_token') {
            showBanner('Invalid or expired verification token.', 'error');
        } else if (msgParam) {
            showBanner(msgParam, 'error');
        }

        // Toggle Password Visibility
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        // Inline Field Validation
        function validateEmail() {
            const val = emailInput.value.trim();
            const err = document.getElementById('email-error');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!val || !emailRegex.test(val)) {
                emailInput.classList.add('has-error');
                err.classList.add('visible');
                return false;
            }
            emailInput.classList.remove('has-error');
            err.classList.remove('visible');
            return true;
        }

        function validatePassword() {
            const val = passwordInput.value;
            const err = document.getElementById('password-error');
            if (!val) {
                passwordInput.classList.add('has-error');
                err.classList.add('visible');
                return false;
            }
            passwordInput.classList.remove('has-error');
            err.classList.remove('visible');
            return true;
        }

        emailInput.addEventListener('blur', validateEmail);
        passwordInput.addEventListener('blur', validatePassword);

        function showBanner(msg, type = 'error') {
            bannerText.innerText = msg;
            banner.className = `auth-banner visible ${type}`;
        }

        function closeBanner() {
            banner.className = 'auth-banner';
        }

        // Form Submit Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            closeBanner();

            const isEmailValid = validateEmail();
            const isPasswordValid = validatePassword();

            if (!isEmailValid || !isPasswordValid) {
                if (!isEmailValid) emailInput.focus();
                else if (!isPasswordValid) passwordInput.focus();
                return;
            }

            submitBtn.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: emailInput.value.trim(),
                        password: passwordInput.value
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    // Check application status to see where to send user
                    try {
                        const appRes = await fetch('/applications/me');
                        if (appRes.ok) {
                            const appData = await appRes.json();
                            if (appData.has_application) {
                                window.location.href = '/static/dashboard.html';
                                return;
                            }
                        }
                    } catch (e) {}

                    window.location.href = nextParam;
                } else {
                    showBanner(data.detail || "Invalid email or password. Please try again.", "error");
                }
            } catch (err) {
                showBanner("Network error — please check your internet connection and try again.", "error");
            } finally {
                submitBtn.disabled = false;
                btnText.innerHTML = 'Log In';
            }
        });
    </script>
</body>
</html>
