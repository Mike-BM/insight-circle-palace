<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Insight Circle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/join.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="join-theme">

    <div class="join-bg" id="login-bg" style="background-image: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=1920&q=80');"></div>
    <div class="join-bg-overlay"></div>

    <a href="/static/index.html" class="join-logo">
        <i class="fa-solid fa-circle-nodes"></i> Insight Circle
    </a>

    <div class="join-container">
        
        <div class="form-step active" style="text-align: center;">
            <i class="fa-solid fa-circle-user" style="font-size: 3rem; color: #ffd700; margin-bottom: 1.5rem;"></i>
            <h1 class="step-title">Welcome Back</h1>
            <p class="step-desc" style="margin: 0 auto 1.5rem auto;">
                You are about to re-enter the Insight Circle platform.
            </p>
            
            <div class="input-wrapper" style="margin-bottom: 2rem; max-width: 300px; margin-left: auto; margin-right: auto;">
                <input type="text" id="application-id" class="reflective-input" placeholder="Your Application ID" style="min-height: auto; padding: 0.5rem 1rem; text-align: center;">
            </div>
            <p id="login-error" style="color: #ff6b6b; margin-bottom: 1rem; display: none; font-size: 0.9rem;"></p>

            <button class="btn-reflective" id="login-btn" onclick="submitLogin()">Enter the Platform</button>
            <span class="submit-subtext" style="margin-top: 1.5rem;">Don't have an invite yet? <a href="/static/join.html" style="color: #ffd700; text-decoration: none;">Apply here</a>.</span>
        </div>

    </div>

    <script>
        async function submitLogin() {
            const btn = document.getElementById('login-btn');
            const appIdInput = document.getElementById('application-id');
            const errorMsg = document.getElementById('login-error');
            const appId = appIdInput.value.trim();

            if (!appId) {
                errorMsg.innerText = "Please enter your Application ID.";
                errorMsg.style.display = 'block';
                return;
            }

            btn.setAttribute('disabled', 'true');
            btn.innerHTML = 'Authenticating...';
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/applications/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ application_id: appId })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Invalid Application ID");
                }

                if (data.status === "approved") {
                    localStorage.setItem('insightCircleMember', 'true');
                    window.location.href = '/static/index.html';
                } else if (data.status === "pending") {
                    const remaining = data.seconds_remaining;
                    const mins = Math.floor(remaining / 60);
                    const secs = remaining % 60;
                    errorMsg.innerText = `Application pending. Time remaining: ${mins}m ${secs}s.`;
                    errorMsg.style.display = 'block';
                    btn.removeAttribute('disabled');
                    btn.innerHTML = 'Enter the Platform';
                }
            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.style.display = 'block';
                btn.removeAttribute('disabled');
                btn.innerHTML = 'Enter the Platform';
            }
        }
    </script>
    <script src="/static/js/gatekeeper.js"></script>
</body>
</html>
