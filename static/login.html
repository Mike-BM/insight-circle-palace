<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Insight Circle</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/join.css">
    <style>
        .auth-container { max-width: 400px; margin: 100px auto; padding: 2rem; background: rgba(0,0,0,0.6); border-radius: 8px; color: white; text-align: center; }
        .auth-input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: none; }
        .btn-auth { background: #ffd700; color: #000; padding: 10px 20px; border: none; font-weight: bold; cursor: pointer; width: 100%; border-radius: 4px; }
        .auth-link { color: #ffd700; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body class="join-theme">
    <div class="join-bg" style="background-image: url('https://images.unsplash.com/photo-1464617265593-010537877478?auto=format&fit=crop&w=1920&q=80')"></div>
    <div class="join-bg-overlay"></div>

    <a href="/static/index.html" class="join-logo">
        <i class="fa-solid fa-circle-nodes"></i> Insight Circle
    </a>
    
    <div class="auth-container">
        <h2>Log In</h2>
        <p>Welcome back to the Circle.</p>
        <form id="login-form">
            <input type="email" id="email" class="auth-input" placeholder="Email Address" required>
            <input type="password" id="password" class="auth-input" placeholder="Password" required>
            <button type="submit" class="btn-auth">Log In</button>
        </form>
        <div id="login-message" style="margin-top: 15px; color: #ff6b6b;"></div>
        <div style="margin-top: 15px;">
            <a href="/static/register.html" class="auth-link">Don't have an account? Sign Up</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = "Logging in...";
            
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if(res.ok) {
                    window.location.href = '/static/index.html';
                } else {
                    document.getElementById('login-message').innerText = data.detail || "Invalid email or password";
                }
            } catch(err) {
                document.getElementById('login-message').innerText = "Network error.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Log In";
            }
        });
    </script>
</body>
</html>
