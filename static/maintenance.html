<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | Insight Circle</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: '#080E1E',
              gold: '#D4A345'
            },
            fontFamily: {
              display: ['"Plus Jakarta Sans"', 'sans-serif'],
              sans: ['Inter', 'sans-serif']
            }
          }
        }
      }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #080E1E;
            color: #f1f5f9; /* slate-100 */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-w: 600px;
            padding: 2rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
        }
        h1 {
            color: #D4A345;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .icon-container {
            font-size: 4rem;
            color: #D4A345;
            margin-bottom: 1rem;
        }
    </style>
    <!-- Prevent Auth FOUC -->
    <script>
        try {
            if (localStorage.getItem('insightCircleMember')) {
                document.documentElement.classList.add('user-logged-in');
            }
        } catch(e) {}
    </script>
    <script src="/static/js/theme-toggle.js"></script>
</head>
<body>
    <div class="container mx-auto">
        <div class="icon-container">
            <i class="fa-solid fa-person-digging"></i>
        </div>
        <h1 class="font-display font-bold">Under Maintenance</h1>
        <p class="font-sans">We are currently upgrading the Insight Circle platform to serve you better. <br> Please check back shortly.</p>
        <p class="text-slate-400 text-sm mt-8">Thank you for your patience!</p>
    </div>
</body>
</html>
