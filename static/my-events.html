<body class="bg-navy text-slate-300 antialiased min-h-screen flex flex-col">

            <!-- Navigation -->
    <script>DS.header()</script>

    <div class="flex-grow max-w-5xl mx-auto w-full mt-28 mb-12 px-6 relative z-10">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-white/10 pb-6 mb-10">
            <div>
                <h1 class="text-3xl font-display font-bold text-white">My Events</h1>
                <p class="text-slate-400 mt-1">Manage your upcoming sessions and access past recordings.</p>
            </div>
            <a href="/monday-registration" class="hidden md:flex items-center gap-2 bg-gold/10 text-gold border border-gold/20 hover:bg-gold/20 px-4 py-2 rounded-lg font-semibold transition-colors">
                <i class="fa-regular fa-calendar-plus"></i> Monday Sessions
            </a>
        </div>

        <div class="space-y-12">
            <!-- Upcoming Events Section -->
            <section>
                <h2 class="text-xl font-display font-bold text-white mb-6 flex items-center gap-3">
                    <i class="fa-regular fa-calendar text-gold"></i> Upcoming Events
                </h2>
                
                <div id="upcoming-events-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Skeletons -->
                    <div class="bg-slate-900 border border-white/10 rounded-2xl p-6 shadow-xl animate-pulse">
                        <div class="h-6 bg-slate-800 rounded w-3/4 mb-2"></div>
                        <div class="h-4 bg-slate-700 rounded w-1/2 mb-6"></div>
                        <div class="flex justify-between">
                            <div class="h-10 bg-slate-800 rounded w-full"></div>
                        </div>
                    </div>
                </div>
                
                <div id="upcoming-empty-state" class="hidden flex flex-col items-center justify-center py-12 bg-slate-900/40 border border-white/5 rounded-2xl border-dashed">
                    <p class="text-slate-400 mb-4">No upcoming events scheduled.</p>
                    <a href="/monday-registration" class="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white font-medium rounded-lg transition-colors border border-white/10">Browse Monday Sessions</a>
                </div>
            </section>

            <!-- Past Events Section -->
            <section>
                <h2 class="text-xl font-display font-bold text-white mb-6 flex items-center gap-3">
                    <i class="fa-solid fa-video text-gold"></i> Past Events & Recordings
                </h2>
                
                <div id="past-events-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Skeletons -->
                    <div class="bg-slate-900 border border-white/10 rounded-2xl p-6 shadow-xl animate-pulse">
                        <div class="h-6 bg-slate-800 rounded w-3/4 mb-2"></div>
                        <div class="h-4 bg-slate-700 rounded w-1/2 mb-6"></div>
                        <div class="flex justify-between">
                            <div class="h-10 bg-slate-800 rounded w-full"></div>
                        </div>
                    </div>
                </div>
                
                <div id="past-empty-state" class="hidden flex flex-col items-center justify-center py-12 bg-slate-900/40 border border-white/5 rounded-2xl border-dashed">
                    <p class="text-slate-400">No past events to display.</p>
                </div>
            </section>
        </div>

            <!-- Footer -->
    <script>DS.footer()</script>
    <noscript><footer class="ds-footer"><div class="ds-container" style="padding-block:2rem"><p><a href="/static/index.html">Home</a> &middot; <a href="/privacy-policy">Privacy Policy</a> &middot; <a href="/terms-and-conditions">Terms and Conditions</a> &middot; <a href="mailto:Insightcirclepalace@gmail.com">Insightcirclepalace@gmail.com</a></p></div></footer></noscript>

    <script src="/static/js/auth-guard.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const user = await window.requireAuth('/static/my-events.html');
            if(!user) return;
            
            if (user.photo_url) {
                document.getElementById('nav-avatar').src = user.photo_url;
            } else {
                document.getElementById('nav-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.full_name)}&background=D4A345&color=fff`;
            }

            try {
                const res = await fetch('/events/me/bookings', { credentials: 'include' });
                
                if (res.ok) {
                    const bookings = await res.json();
                    
                    const upcomingContainer = document.getElementById('upcoming-events-container');
                    const upcomingEmpty = document.getElementById('upcoming-empty-state');
                    
                    const pastContainer = document.getElementById('past-events-container');
                    const pastEmpty = document.getElementById('past-empty-state');
                    
                    const now = new Date();
                    const upcoming = bookings.filter(b => new Date(b.event.event_date) >= now);
                    const past = bookings.filter(b => new Date(b.event.event_date) < now);

                    // Upcoming Events Render
                    if (upcoming.length === 0) {
                        upcomingContainer.innerHTML = '';
                        upcomingEmpty.classList.remove('hidden');
                    } else {
                        upcomingContainer.innerHTML = upcoming.map(b => {
                            const date = new Date(b.event.event_date);
                            const linkHtml = b.event.meeting_link ? 
                                `<a href="${b.event.meeting_link}" target="_blank" class="w-full py-3 bg-slate-800 text-white border border-slate-700 hover:bg-slate-700 hover:bg-opacity-90 text-white font-bold rounded-lg text-sm transition-all flex items-center justify-center gap-2"><i class="fa-solid fa-video"></i> Join Meeting</a>` : 
                                `<button disabled class="w-full py-3 bg-slate-800 text-slate-500 cursor-not-allowed font-medium rounded-lg text-sm border border-white/5 flex items-center justify-center gap-2"><i class="fa-solid fa-clock"></i> Link TBA</button>`;
                                
                            return `
                            <div class="bg-slate-900 border border-white/10 rounded-2xl p-6 shadow-xl flex flex-col h-full border-l-4 border-l-gold">
                                <div class="flex justify-between items-start mb-4">
                                    <h3 class="text-lg font-display font-bold text-white pr-4">${b.event.title}</h3>
                                </div>
                                <div class="space-y-3 mb-6">
                                    <div class="flex items-center gap-3 text-sm text-slate-300">
                                        <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-gold"><i class="fa-regular fa-calendar"></i></div>
                                        <span>${date.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>
                                    </div>
                                    <div class="flex items-center gap-3 text-sm text-slate-300">
                                        <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-gold"><i class="fa-regular fa-clock"></i></div>
                                        <span>${date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</span>
                                    </div>
                                </div>
                                <div class="mt-auto">
                                    ${linkHtml}
                                </div>
                            </div>
                        `}).join('');
                    }

                    // Past Events Render
                    if (past.length === 0) {
                        pastContainer.innerHTML = '';
                        pastEmpty.classList.remove('hidden');
                    } else {
                        pastContainer.innerHTML = past.map(b => {
                            const date = new Date(b.event.event_date);
                            const linkHtml = b.event.recording_link ? 
                                `<a href="${b.event.recording_link}" target="_blank" class="w-full py-2 bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 border border-blue-500/30 font-medium rounded-lg text-sm transition-all flex items-center justify-center gap-2"><i class="fa-solid fa-play"></i> Watch Recording</a>` : 
                                `<a href="/recordings" class="w-full py-2 bg-gold/10 hover:bg-gold/20 text-gold border border-gold/30 font-medium rounded-lg text-sm transition-all flex items-center justify-center gap-2"><i class="fa-solid fa-circle-play"></i> Explore Recordings</a>`;
                                
                            return `
                            <div class="bg-slate-900 border border-white/10 rounded-2xl p-6 shadow-xl flex flex-col h-full opacity-80 hover:opacity-100 transition-opacity">
                                <div class="flex justify-between items-start mb-4">
                                    <h3 class="text-lg font-display font-bold text-white pr-4">${b.event.title}</h3>
                                </div>
                                <div class="flex items-center gap-3 text-sm text-slate-400 mb-6">
                                    <i class="fa-solid fa-check text-green-400"></i>
                                    <span>Concluded on ${date.toLocaleDateString()}</span>
                                </div>
                                <div class="mt-auto">
                                    ${linkHtml}
                                </div>
                            </div>
                        `}).join('');
                    }
                } else {
                    document.getElementById('upcoming-events-container').innerHTML = `
                        <div class="col-span-full p-4 bg-red-500/10 border border-red-500/20 text-red-400 rounded-lg text-center">
                            Failed to load events.
                        </div>`;
                    document.getElementById('past-events-container').innerHTML = '';
                }
            } catch(e) {
                console.error(e);
            }
        });
    </script>
