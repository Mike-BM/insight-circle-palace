<body class="bg-navy text-slate-300 antialiased min-h-screen flex flex-col">

    <div class="flex-grow max-w-6xl mx-auto w-full mt-28 mb-12 px-6 relative z-10">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-white/10 pb-6 mb-10">
            <div>
                <h1 class="text-3xl font-display font-bold text-white">My Programs</h1>
                <p class="text-slate-400 mt-1">Continue learning and track your progress.</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="window.openFeedbackModal && window.openFeedbackModal({ context: 'program_viewed', category: 'Programs & Content' })" class="hidden sm:flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-white/10 px-3 py-2 rounded-lg text-sm font-medium transition-colors">
                    <i class="fa-solid fa-lightbulb text-gold"></i> Feedback & Ideas
                </button>
                <a href="/static/explore.html#programs" class="hidden md:flex items-center gap-2 bg-gold/10 text-gold border border-gold/20 hover:bg-gold/20 px-4 py-2 rounded-lg font-semibold transition-colors">
                    <i class="fa-solid fa-compass"></i> Explore More
                </a>
            </div>
        </div>

        <div id="programs-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Skeletons -->
            <div class="bg-slate-900 border border-white/10 rounded-2xl p-8 shadow-xl animate-pulse">
                <div class="h-6 bg-slate-800 rounded w-1/2 mb-4"></div>

            </div>
        </div>
        
        <div id="empty-state" class="hidden flex flex-col items-center justify-center text-center py-20 bg-slate-900/40 border border-white/5 rounded-2xl">

                <i class="fa-solid fa-book-open text-3xl text-slate-500"></i>
            </div>
            <h3 class="text-xl font-display font-bold text-white mb-2">No active programs</h3>
            <p class="text-slate-400 max-w-md mx-auto mb-6">You haven't enrolled in any programs yet. Discover pathways and start your journey today.</p>
            <a href="/static/explore.html#programs" class="px-6 py-3 bg-gold text-navy font-bold rounded-lg hover:bg-opacity-90 shadow-sm transition-all">Explore Programs</a>
        </div>

            <!-- Footer -->

    <noscript><footer class="ds-footer"><div class="ds-container" style="padding-block:2rem"><p><a href="/static/index.html">Home</a> &middot; <a href="/privacy-policy">Privacy Policy</a> &middot; <a href="/terms-and-conditions">Terms and Conditions</a> &middot; <a href="mailto:Insightcirclepalace@gmail.com">Insightcirclepalace@gmail.com</a></p></div></footer></noscript>

    <script src="/static/js/auth-guard.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const user = await window.requireAuth('/static/my-programs.html');
            if(!user) return;
            
            if (user.photo_url) {
                document.getElementById('nav-avatar').src = user.photo_url;
            } else {
                document.getElementById('nav-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.full_name)}&background=D4A345&color=fff`;
            }

            try {
                const res = await fetch('/programs/me/enrollments', { credentials: 'include' });
                
                if (res.ok) {
                    const enrollments = await res.json();
                    const container = document.getElementById('programs-container');
                    const emptyState = document.getElementById('empty-state');
                    
                    if (enrollments.length === 0) {
                        container.innerHTML = '';
                        emptyState.classList.remove('hidden');
                    } else {
                        container.innerHTML = enrollments.map(e => {
                            const slug = e.program_slug || e.slug || '';
                            const progress = e.completion_percentage !== undefined ? e.completion_percentage : (e.status === 'completed' ? 100 : (e.status === 'in_progress' ? 35 : 0));
                            const statusColor = e.status === 'completed' ? 'text-green-400 border-green-500/30' : 'text-gold border-gold/30';
                            const statusText = e.status === 'completed' ? 'Completed' : (e.status === 'in_progress' ? 'In Progress' : 'Enrolled');
                            const learnUrl = e.learn_url || `/static/learn.html?program=${encodeURIComponent(slug)}`;
                            const lessonInfo = e.current_lesson_title ? `<p class="text-xs text-slate-400 mt-1"><i class="fa-regular fa-bookmark text-gold mr-1"></i> Current: <span class="text-white font-medium">${e.current_lesson_title}</span></p>` : '';
                            const btnText = progress === 100 ? 'Review Program Curriculum' : (progress > 0 ? 'Resume Learning' : 'Start Learning');
                            
                            return `
                            <div class="bg-slate-900 border border-white/10 rounded-2xl p-8 shadow-xl flex flex-col h-full group hover:border-gold/30 transition-colors">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-xl font-display font-bold text-white group-hover:text-gold transition-colors">${e.program || 'Program'}</h3>
                                    <span class="text-xs font-semibold px-2.5 py-1 bg-slate-800 rounded-full border ${statusColor} uppercase tracking-wider">${statusText}</span>
                                </div>
                                ${lessonInfo}
                                
                                <p class="text-sm text-slate-400 my-4 flex-grow">Interactive learning pathway with sequential lessons, knowledge checks, and verifiable certification.</p>
                                
                                <div class="mb-6">
                                    <div class="flex justify-between text-xs text-slate-400 mb-2">
                                        <span>Curriculum Progress</span>
                                        <span class="font-bold text-gold">${progress}%</span>
                                    </div>
                                    <div class="h-2.5 w-full bg-slate-800 rounded-full overflow-hidden border border-white/5">
                                        <div class="h-full bg-gradient-to-r from-gold to-[#E5A93C]" style="width: ${progress}%;"></div>
                                    </div>
                                </div>
                                
                                <div class="mt-auto">
                                    <a href="${learnUrl}" class="w-full py-3 bg-gradient-to-r from-gold to-[#E5A93C] hover:brightness-110 text-navy font-bold rounded-lg text-sm transition-all flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(212,163,69,0.2)]">
                                        ${btnText} <i class="fa-solid fa-arrow-right"></i>
                                    </a>
                                </div>
                            </div>
                        `;}).join('');
                    }
                } else {
                    document.getElementById('programs-container').innerHTML = `
                        <div class="col-span-full p-4 bg-red-500/10 border border-red-500/20 text-red-400 rounded-lg text-center">
                            Failed to load programs. Please try again later.
                        </div>`;
                }
            } catch(e) {
                console.error(e);
                document.getElementById('programs-container').innerHTML = `
                    <div class="col-span-full p-4 bg-red-500/10 border border-red-500/20 text-red-400 rounded-lg text-center">
                        Network error while loading programs.
                    </div>`;
            }
        });
    </script>
