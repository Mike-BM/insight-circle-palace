    <script src="/static/js/auth-guard.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const user = await window.requireAuth('/static/profile.html');
            if(!user) return;
            
            // Track baseline form values & dirty state
            let isFormDirty = false;
            const unsavedIndicator = document.getElementById('unsaved-indicator');
            const statusBanner = document.getElementById('profile-status-banner');
            const statusText = document.getElementById('profile-status-text');
            const statusIcon = document.getElementById('profile-status-icon');

            function showProfileNotice(msg, isSuccess = true) {
                if (!statusBanner) return;
                statusBanner.className = isSuccess 
                    ? 'mb-6 p-4 rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 text-sm font-medium flex items-center justify-between gap-4 transition-all duration-300'
                    : 'mb-6 p-4 rounded-xl border border-red-500/30 bg-red-500/10 text-red-300 text-sm font-medium flex items-center justify-between gap-4 transition-all duration-300';
                
                if (statusIcon) {
                    statusIcon.className = isSuccess 
                        ? 'fa-solid fa-circle-check text-emerald-400 text-lg flex-shrink-0'
                        : 'fa-solid fa-circle-exclamation text-red-400 text-lg flex-shrink-0';
                }
                if (statusText) statusText.innerText = msg;
                statusBanner.classList.remove('hidden');
                
                // Scroll banner into view if offscreen
                statusBanner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            function markDirty() {
                isFormDirty = true;
                if (unsavedIndicator) unsavedIndicator.classList.remove('hidden');
            }

            function clearDirty() {
                isFormDirty = false;
                if (unsavedIndicator) unsavedIndicator.classList.add('hidden');
            }

            // Warn on accidental exit
            window.addEventListener('beforeunload', (e) => {
                if (isFormDirty) {
                    e.preventDefault();
                    e.returnValue = 'You have unsaved profile changes.';
                }
            });

            // Populate form
            document.getElementById('profile-fullname').value = user.full_name || '';
            document.getElementById('profile-email').value = user.email || '';
            document.getElementById('profile-phone').value = user.phone || '';
            document.getElementById('profile-country').value = user.country || '';
            document.getElementById('profile-education').value = user.education_level || '';
            document.getElementById('profile-bio').value = user.bio || '';
            document.getElementById('profile-photo').value = user.photo_url || '';

            // Bio character counter
            const bioTextarea = document.getElementById('profile-bio');
            const bioCounter = document.getElementById('bio-counter');
            function updateBioCounter() {
                if (bioCounter && bioTextarea) {
                    const len = bioTextarea.value.length;
                    bioCounter.innerText = `${len} / 500`;
                    if (len >= 480) {
                        bioCounter.classList.add('text-amber-400');
                    } else {
                        bioCounter.classList.remove('text-amber-400');
                    }
                }
            }
            updateBioCounter();
            if (bioTextarea) {
                bioTextarea.addEventListener('input', () => {
                    updateBioCounter();
                    markDirty();
                });
            }

            // Listen for input changes to track dirty state
            ['profile-fullname', 'profile-phone', 'profile-country', 'profile-education'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', markDirty);
                    el.addEventListener('change', markDirty);
                }
            });
            
            // Update UI elements
            document.getElementById('display-name').innerText = user.full_name;
            const roleFormatted = user.role.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
            document.getElementById('display-role').innerText = roleFormatted;
            
            const avatarUrl = user.photo_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.full_name)}&background=D4A345&color=fff`;
            document.getElementById('profile-avatar-display').src = avatarUrl;
            document.getElementById('nav-avatar').src = avatarUrl;

            // Profile Completion Logic
            const fieldsToTrack = ['full_name', 'email', 'phone', 'country', 'education_level', 'photo_url', 'bio'];
            function updateProfileProgress(userData) {
                let filled = 0;
                fieldsToTrack.forEach(f => {
                    if (userData[f] && userData[f].toString().trim() !== "") filled++;
                });
                const pct = Math.round((filled / fieldsToTrack.length) * 100);
                document.getElementById('profile-completion').innerText = `${pct}%`;
                document.getElementById('profile-progress-bar').style.width = `${pct}%`;
            }
            updateProfileProgress(user);

            // Handle Photo Upload seamlessly
            const photoInput = document.getElementById('profile-photo-file');
            photoInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // Validate size (< 10MB)
                if (file.size > 10 * 1024 * 1024) {
                    showProfileNotice("File is too large. Please select an image under 10MB.", false);
                    return;
                }

                const statusEl = document.getElementById('upload-status');
                statusEl.innerText = "Compressing photo...";
                statusEl.classList.remove('hidden', 'text-red-400');
                statusEl.classList.add('text-gold');

                // Client-side image compression helper
                async function compressClientImage(imgFile, maxWidth = 800, maxHeight = 800, quality = 0.82) {
                    return new Promise((resolve) => {
                        const img = new Image();
                        const objectUrl = URL.createObjectURL(imgFile);
                        img.onload = () => {
                            URL.revokeObjectURL(objectUrl);
                            let width = img.width;
                            let height = img.height;
                            if (width > maxWidth || height > maxHeight) {
                                if (width > height) {
                                    height = Math.round((height * maxWidth) / width);
                                    width = maxWidth;
                                } else {
                                    width = Math.round((width * maxHeight) / height);
                                    height = maxHeight;
                                }
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            canvas.toBlob((blob) => {
                                if (blob) {
                                    resolve(new File([blob], 'avatar.webp', { type: 'image/webp' }));
                                } else {
                                    resolve(imgFile);
                                }
                            }, 'image/webp', quality);
                        };
                        img.onerror = () => {
                            URL.revokeObjectURL(objectUrl);
                            resolve(imgFile);
                        };
                        img.src = objectUrl;
                    });
                }

                let uploadFile = file;
                try {
                    uploadFile = await compressClientImage(file);
                } catch (e) {
                    console.warn("Client compression skipped:", e);
                }

                // Temporary preview
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('profile-avatar-display').src = event.target.result;
                };
                reader.readAsDataURL(uploadFile);

                statusEl.innerText = "Uploading photo...";

                const formData = new FormData();
                formData.append('file', uploadFile);
                
                try {
                    const uploadRes = await fetch('/auth/me/photo', {
                        method: 'POST',
                        body: formData,
                        credentials: 'include'
                    });
                    
                    if (uploadRes.ok) {
                        const updatedUser = await uploadRes.json();
                        document.getElementById('profile-photo').value = updatedUser.photo_url;
                        document.getElementById('nav-avatar').src = updatedUser.photo_url;
                        statusEl.innerText = "Photo saved!";
                        statusEl.classList.replace('text-gold', 'text-green-400');
                        updateProfileProgress(updatedUser);
                        showProfileNotice("Profile picture updated successfully!", true);
                        
                        setTimeout(() => statusEl.classList.add('hidden'), 3000);
                    } else {
                        const data = await uploadRes.json();
                        statusEl.innerText = data.detail || "Upload failed.";
                        statusEl.classList.replace('text-gold', 'text-red-400');
                        document.getElementById('profile-avatar-display').src = avatarUrl;
                        showProfileNotice(data.detail || "Photo upload failed.", false);
                    }
                } catch(err) {
                    statusEl.innerText = "Network error during upload.";
                    statusEl.classList.replace('text-gold', 'text-red-400');
                    document.getElementById('profile-avatar-display').src = avatarUrl;
                    showProfileNotice("Network error uploading photo.", false);
                }
            });

            // Save Form
            document.getElementById('profile-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const fullnameInput = document.getElementById('profile-fullname');
                const fullnameError = document.getElementById('fullname-error');
                const fullNameVal = (fullnameInput.value || '').trim();

                // Validate Full Name
                if (fullNameVal.length < 2) {
                    if (fullnameError) fullnameError.classList.remove('hidden');
                    fullnameInput.focus();
                    showProfileNotice("Please enter a valid full name (minimum 2 characters).", false);
                    return;
                } else {
                    if (fullnameError) fullnameError.classList.add('hidden');
                }

                const btn = document.getElementById('save-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...';
                btn.disabled = true;

                const updateData = {
                    full_name: fullNameVal,
                    phone: (document.getElementById('profile-phone').value || '').trim(),
                    country: (document.getElementById('profile-country').value || '').trim(),
                    education_level: document.getElementById('profile-education').value,
                    photo_url: document.getElementById('profile-photo').value,
                    bio: (document.getElementById('profile-bio').value || '').trim()
                };

                try {
                    const res = await fetch('/auth/me', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updateData),
                        credentials: 'include'
                    });

                    if (res.ok) {
                        const updatedUser = await res.json();
                        document.getElementById('display-name').innerText = updatedUser.full_name;
                        updateProfileProgress(updatedUser);
                        clearDirty();
                        showProfileNotice("Profile changes saved successfully!", true);
                        
                        // Button success feedback
                        btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Saved!';
                        btn.classList.add('bg-emerald-500');
                        setTimeout(() => {
                            btn.innerHTML = originalText;
                            btn.disabled = false;
                            btn.classList.remove('bg-emerald-500');
                        }, 2000);
                    } else {
                        const data = await res.json();
                        showProfileNotice(data.detail || "Failed to update profile. Please check the entered fields.", false);
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                } catch(err) {
                    console.error("Profile save error:", err);
                    showProfileNotice("Network error occurred while saving profile. Please check your connection and retry.", false);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });
            
        });
    </script>
