<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Insight Circle Palace</title>
    <meta name="description" content="Set a new password for your Insight Circle Palace account.">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon-32x32.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: '#080E1E',
              surface: '#0B1528',
              gold: '#D4A345',
              'gold-light': '#F5D061',
            },
            fontFamily: {
              display: ['"Plus Jakarta Sans"', 'sans-serif'],
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- Prevent Auth FOUC -->
    <script>
        try {
            if (localStorage.getItem('insightCircleMember')) {
                document.documentElement.classList.add('user-logged-in');
            }
        } catch(e) {}
    </script>
</head>
<body class="bg-navy text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-gold selection:text-navy">

    <!-- Header Navigation -->
    <header class="border-b border-white/5 py-4 px-6 sm:px-12 flex justify-between items-center backdrop-blur-md bg-navy/80 sticky top-0 z-40">
        <a href="/static/index.html" class="flex items-center gap-3 group" style="text-decoration:none;">
            <img src="/static/assets/logo.jpg" alt="Insight Circle Palace" class="h-10 w-10 rounded-full border border-gold/40 object-cover shadow-sm group-hover:scale-105 transition-transform">
            <span class="font-display font-bold text-lg text-white tracking-wider group-hover:text-gold transition-colors">INSIGHT CIRCLE</span>
        </a>
        <a href="/static/login.html" class="text-sm font-semibold text-slate-400 hover:text-white transition-colors flex items-center gap-2">
            <i class="fa-solid fa-arrow-left text-xs"></i> Back to Login
        </a>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex items-center justify-center p-6 sm:p-12 relative overflow-hidden">
        <!-- Background Ambient Glow -->
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-gold/10 rounded-full blur-[120px] pointer-events-none"></div>

        <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-2xl border border-white/10 shadow-2xl rounded-2xl p-8 relative z-10">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-gold/10 border border-gold/30 text-gold mb-3">
                    <i class="fa-solid fa-key text-lg"></i>
                </div>
                <h1 class="text-2xl font-display font-bold text-white mb-2">Create New Password</h1>
                <p class="text-slate-400 text-sm">Please choose a secure password of at least 8 characters.</p>
            </div>

            <!-- Alert Notification -->
            <div id="reset-alert" class="hidden rounded-lg p-3.5 mb-6 text-sm flex items-start gap-2.5" role="alert">
                <i id="alert-icon" class="fa-solid fa-circle-exclamation mt-0.5"></i>
                <span id="alert-text" class="flex-1"></span>
            </div>

            <form id="reset-password-form" onsubmit="handleResetSubmit(event)" class="space-y-5">
                <div>
                    <label for="new-password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">New Password</label>
                    <div class="relative">
                        <input type="password" id="new-password" required minlength="8" class="w-full bg-slate-800/60 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-gold/80 focus:ring-1 focus:ring-gold/40 transition-all" placeholder="At least 8 characters" autocomplete="new-password">
                        <button type="button" onclick="togglePasswordVisibility('new-password', 'toggle-icon-1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                            <i class="fa-solid fa-eye" id="toggle-icon-1"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirm-password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Confirm New Password</label>
                    <div class="relative">
                        <input type="password" id="confirm-password" required minlength="8" class="w-full bg-slate-800/60 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-gold/80 focus:ring-1 focus:ring-gold/40 transition-all" placeholder="Re-enter your password" autocomplete="new-password">
                        <button type="button" onclick="togglePasswordVisibility('confirm-password', 'toggle-icon-2')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                            <i class="fa-solid fa-eye" id="toggle-icon-2"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full mt-2 py-3.5 bg-gradient-to-r from-gold to-[#E5A93C] text-navy font-bold rounded-lg hover:brightness-110 active:scale-95 transition-all shadow-[0_0_15px_rgba(212,163,69,0.25)]">
                    <span id="btn-text">Update Password</span>
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400">
                Remember your password? <a href="/static/login.html" class="text-gold hover:text-white transition-colors">Sign in here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-white/5">
        &copy; 2026 Insight Circle Palace. All rights reserved.
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const alertBox = document.getElementById('reset-alert');
        const alertText = document.getElementById('alert-text');
        const alertIcon = document.getElementById('alert-icon');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');

        if (!token) {
            showAlert('No reset token found in link. Please request a new password reset link.', 'error');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        function showAlert(message, type = 'error') {
            alertBox.classList.remove('hidden');
            alertText.innerText = message;
            if (type === 'success') {
                alertBox.className = 'rounded-lg p-3.5 mb-6 text-sm flex items-start gap-2.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-300';
                alertIcon.className = 'fa-solid fa-check-circle mt-0.5 text-emerald-400';
            } else {
                alertBox.className = 'rounded-lg p-3.5 mb-6 text-sm flex items-start gap-2.5 bg-red-500/10 border border-red-500/30 text-red-300';
                alertIcon.className = 'fa-solid fa-circle-exclamation mt-0.5 text-red-400';
            }
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleResetSubmit(e) {
            e.preventDefault();
            if (!token) {
                showAlert('Missing reset token. Please request a new link.', 'error');
                return;
            }

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword.length < 8) {
                showAlert('Password must be at least 8 characters long.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match. Please re-enter.', 'error');
                return;
            }

            submitBtn.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Updating...';

            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: newPassword })
                });

                const data = await response.json();

                if (!response.ok) {
                    const errorMsg = data.detail || 'Failed to reset password. The link may have expired.';
                    showAlert(errorMsg, 'error');
                    submitBtn.disabled = false;
                    btnText.innerText = 'Update Password';
                    return;
                }

                showAlert('Password updated successfully! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = '/static/login.html?msg=' + encodeURIComponent('Password reset successfully. Please sign in with your new password.');
                }, 1800);

            } catch (err) {
                showAlert('Network error. Please check your connection and try again.', 'error');
                submitBtn.disabled = false;
                btnText.innerText = 'Update Password';
            }
        }
    </script>
</body>
</html>
